server:
  port: ${PORT_DISENOS:8096}
  error:
    include-message: always
    include-binding-errors: always

spring:
  servlet:
    multipart:
      max-file-size: ${MAX_TECHNICAL_FILE_MB:25}MB
      max-request-size: ${MAX_TECHNICAL_FILE_MB:25}MB
  application:
    name: servicio-disenos

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/embroidery_disenos}
    username: ${SPRING_DATASOURCE_USERNAME:disenos_user}
    password: ${SPRING_DATASOURCE_PASSWORD:disenos_pass_dev_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# JWT y Seguridad
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Almacenamiento local de archivos técnicos
app:
  clients:
    preview-url: ${CLIENT_PREVIEW_URL:http://localhost:8101}
  storage:
    upload-dir: ${UPLOAD_DIR:/var/data/embroidery/disenos}

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
