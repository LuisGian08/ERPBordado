server:
  port: 8095
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${CORS_ALLOWED_ORIGIN:http://localhost:3000}"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: servicio-carpetas
          uri: ${SERVICE_DISENOS_URI:http://localhost:8096}
          predicates:
            - Path=/api/v1/carpetas/**
        - id: servicio-precios
          uri: ${SERVICE_DISENOS_URI:http://localhost:8096}
          predicates:
            - Path=/api/v1/precios/**
        - id: servicio-disenos
          uri: ${SERVICE_DISENOS_URI:http://localhost:8096}
          predicates:
            - Path=/api/v1/disenos/**
        - id: servicio-inventario
          uri: ${SERVICE_INVENTARIO_URI:http://localhost:8097}
          predicates:
            - Path=/api/v1/inventario/**
        - id: servicio-trabajos
          uri: ${SERVICE_TRABAJOS_URI:http://localhost:8098}
          predicates:
            - Path=/api/v1/trabajos/**
        - id: servicio-clientes
          uri: ${SERVICE_TRABAJOS_URI:http://localhost:8098}
          predicates:
            - Path=/api/v1/clientes/**
        - id: servicio-pagos
          uri: ${SERVICE_PAGOS_URI:http://localhost:8099}
          predicates:
            - Path=/api/v1/pagos/**
        - id: servicio-auth
          uri: ${SERVICE_AUTH_URI:http://localhost:8100}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/usuarios/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET}
